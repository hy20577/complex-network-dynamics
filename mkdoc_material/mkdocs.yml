site_name: Complex Network Dynamics
site_description: Simulation and stability analysis of nonlinear dynamical systems and complex networks
repo_url: https://github.com/hy20577/complex-network-dynamics
repo_name: hy20577/complex-network-dynamics
site_url: https://hy20577.github.io/complex-network-dynamics/

theme:
  font:
    text: Merriweather Sans
    code: Red Hat Mono
  name: material
  custom_dir: overrides # Adds a download button to notebook pages
  features:
    - navigation.tabs # Creates a nice top navigation bar
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: slate
    primary: green
    accent: deep purple

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Introduction to Network Theory: tutorials/01_introduction_to_network_theory.ipynb
      - Network Types: tutorials/02_network_types.ipynb
      - Logistic and Circle Maps: tutorials/03_logistic_and_circle_maps.ipynb
      - Coupled Discrete Models: tutorials/04_coupled_discrete_models.ipynb
      - Lyapunov Exponents of Coupled Maps: tutorials/05_discrete_models_lyapunov.ipynb
      - Numerical Integration of ODEs: tutorials/06_numerical_integration_odes.ipynb
      - Lorenz System with the Library: tutorials/07_lorenz_with_the_library.ipynb
      - Correlation and Mutual Information: tutorials/08_correlation_and_mutual_information.ipynb
  - API Reference:
      - Datasets: api/datasets.md
      - Discrete Models: api/discrete_models.md
      - Continuous Models: api/continuous_models.md
      - Integrators: api/integrators.md
      - Network Inference: api/network_inference.md
      - Network Metrics: api/network_metrics.md
  - Publications: publications.md

plugins:
  - search
  - mkdocs-jupyter:
      execute: false # Show the notebooks with their saved outputs
      include_source: true # Adds a download button for the .ipynb
      ignore_h1_titles: true # Use the titles from nav
  - mkdocstrings:
      handlers:
        python:
          paths: [..] # Project root, so the package is found without installing it
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
