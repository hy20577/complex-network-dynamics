{#- Material's tabs, with a menu button before the first tab that hides and
    shows the left menu on wide screens (see extra.css) -#}
{% import "partials/tabs-item.html" as item with context %}
<nav class="md-tabs" aria-label="{{ lang.t('tabs') }}" data-md-component="tabs">
  <div class="md-grid">
    <ul class="md-tabs__list">
      <li class="md-tabs__item cnd-tabs__menu">
        <label class="md-tabs__link" for="__drawer" title="Menu" aria-label="Menu">
          {% include ".icons/material/menu.svg" %}
        </label>
      </li>
      {% for nav_item in nav.items %}
        {{ item.render(nav_item) }}
      {% endfor %}
    </ul>
  </div>
</nav>
