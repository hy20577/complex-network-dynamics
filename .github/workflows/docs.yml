# Rebuilds the documentation site and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://hy20577.github.io/complex-network-dynamics/
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "mkdoc_material/**"
      - "complex_network_dynamics/**" # API pages are generated from the docstrings
      - ".github/workflows/docs.yml"
  workflow_dispatch: # Allows a manual run from the Actions tab

permissions:
  contents: write # Needed to push to gh-pages

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mkdoc_material/requirements.txt

      - name: Install MkDocs and plugins
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc # Used to convert notebook markdown
          pip install -r mkdoc_material/requirements.txt

      - name: Build and deploy
        working-directory: mkdoc_material
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --strict -m "Deploy docs from {sha}"
