[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-network-dynamics"
version = "0.1.0"
description = "Simulation and stability analysis of nonlinear dynamical systems and Complex Networks"
readme = "README.md"
# Safe bound if you want to ensure Numba compatibility:
requires-python = ">=3.10, <3.14"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "numba",
    "networkx"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
# Tells setuptools to bundle all files in the Data folder and subfolders
"complex_network_dynamics" = ["Data/*", "Data/**/*"]
