[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-network-dynamics"
version = "0.1.0"
description = "Simulation and stability analysis of nonlinear dynamical systems and Complex Networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hüseyin Yıldırım" }]
keywords = [
    "complex networks",
    "network inference",
    "mutual information rate",
    "surrogate data",
    "chaos",
    "Lyapunov exponents",
    "synchronisation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
# Safe bound if you want to ensure Numba compatibility:
requires-python = ">=3.10, <3.14"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "numba",
    "networkx"
]

[project.urls]
Homepage = "https://hy20577.github.io/complex-network-dynamics/"
Documentation = "https://hy20577.github.io/complex-network-dynamics/"
Source = "https://github.com/hy20577/complex-network-dynamics"
Paper = "https://doi.org/10.1016/j.chaos.2024.115554"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["complex_network_dynamics*"]

[tool.setuptools.package-data]
# Tells setuptools to bundle all files in the Data folder and subfolders
"complex_network_dynamics" = ["Data/*", "Data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
